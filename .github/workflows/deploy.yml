# Nombre del Workflow para identificarlo en la pestaña "Actions" de GitHub
name: Deploy React App to GitHub Pages

on:
  # Se ejecuta en cada push a la rama 'main'
  push:
    branches: ["main"]

  # Permite ejecutar este workflow manualmente desde la pestaña Actions
  workflow_dispatch:

# Configura los permisos para que el workflow pueda desplegar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Un único trabajo llamado 'deploy'
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga el código de tu repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configura Node.js para poder usar npm
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Instala las dependencias del proyecto
      - name: Install dependencies
        run: npm install

      # 4. Construye la aplicación para producción
      - name: Build
        run: npm run build

      # 5. Prepara el artefacto para el despliegue en GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 6. Sube el artefacto (la carpeta 'dist')
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # 7. Despliega el artefacto en GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4